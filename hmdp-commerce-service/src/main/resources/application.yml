server:
  port: 8086
spring:
  application:
    name: hmdp-commerce
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  data:
    redis:
      host: redis
      password: plus-local
  rabbitmq:
    host: ${RABBIT_HOST:rabbitmq}
    username: shiqu
    password: shiqu-local
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    connection-timeout: 3000
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
        group: ${DISCOVERY_GROUP:shiqu}
  jackson:
    default-property-inclusion: non_null
    time-zone: GMT+8
    generator:
      WRITE_NUMBERS_AS_STRINGS: true
commerce:
  mock-payment-enabled: true
  payment-minutes: 15
  rabbit:
    exchange: ${COMMERCE_RABBIT_EXCHANGE:commerce-orders-v2}
    queue: ${COMMERCE_RABBIT_QUEUE:commerce-orders-v2}
dubbo:
  application:
    name: ${spring.application.name}
    qos-enable: false
  protocol:
    name: dubbo
    port: -1
  registry:
    address: nacos://nacos:8848
    register-mode: interface
  consumer:
    check: false
    retries: 0
    timeout: 3000
  config-center:
    address: nacos://nacos:8848
  metadata-report:
    address: nacos://nacos:8848
management:
  endpoints:
    web:
      exposure:
        include: health,info
