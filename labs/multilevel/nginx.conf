worker_processes 1;
events {worker_connections 512;}
http {
  lua_shared_dict shop_cache 1m;
  resolver 127.0.0.11 ipv6=off;
  upstream tomcat {hash $request_uri consistent; server app:8080; server app2:8080;}
  server {
    listen 80;
    location /internal/ {proxy_pass http://tomcat;}
    location /multilevel/shop/ {content_by_lua_file /etc/nginx/shop.lua;}
    location = /_invalidate {
      content_by_lua_block {
        if ngx.req.get_headers()['X-Lab-Key'] ~= 'plus-cache-internal' then return ngx.exit(403) end
        local id=ngx.req.get_uri_args().id
        if not id then return ngx.exit(400) end
        ngx.shared.shop_cache:delete('shop:'..id); ngx.say('OK')
      }
    }
  }
}
