worker_processes 1;
events { worker_connections 256; }
http {
  include /usr/local/openresty/nginx/conf/mime.types;
  server {
    listen 80;
    root /web;
    add_header Cache-Control "no-cache" always;
    location /api/ { proxy_pass http://commerce-test-gateway:8080/; proxy_set_header Authorization $http_authorization; }
    location /imgs/blogs/upload/ { alias /uploads/blogs/upload/; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
