worker_processes 1;
events { worker_connections 1024; }
http {
  include /usr/local/openresty/nginx/conf/mime.types;
  server {
    listen 80;
    root /web;
    index index.html;
    client_max_body_size 10m;
    add_header Cache-Control "no-cache" always;
    location /api/ { proxy_pass http://gateway:8080/; proxy_set_header Authorization $http_authorization; }
    location /imgs/blogs/upload/ { alias /uploads/blogs/upload/; }
    location /src/assets/imgs/ { alias /web/imgs/; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
